<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111318">
  <meta name="description" content="2Spine: создание Spine-анимации из многослойного PSD.">
  <title>2Spine — PSD → Spine</title>
  <style>
    :root { color-scheme:dark; font: 16px/1.5 -apple-system,BlinkMacSystemFont,Segoe UI,sans-serif; background:#101116; color:#e8e9f0; }
    * { box-sizing:border-box }
    body { margin:0; min-height:100vh; display:flex; flex-direction:column }
    header,main,footer { width:min(100%,960px); margin-inline:auto; padding-inline:24px }
    header { padding-block:28px 18px; display:flex; align-items:center; gap:14px; border-bottom:1px solid #2a2c34 }
    .mark { display:inline-grid; place-items:center; width:45px; height:45px; border:1px solid #57402e; border-radius:13px; background:#24201e; color:#fda767; font-size:23px; font-weight:800 }
    .brand { font-size:22px; font-weight:760; letter-spacing:.035em }
    .version { color:#838794; font-size:12px; align-self:center }
    main { flex:1; padding-block:35px 45px }
    h1 { font-size:clamp(26px,4vw,39px); margin:0 0 8px; letter-spacing:-.035em }
    .subtitle { color:#a7aab5; margin:0 0 28px; max-width:600px }
    .grid { display:grid; grid-template-columns:1fr 1fr; gap:20px }
    .panel { padding:24px; background:#191b23; border:1px solid #323641; border-radius:16px; min-width:0 }
    h2 { font-size:16px; margin:0 0 16px }
    label { display:block; font-size:13px; color:#c2c6cf; margin:15px 0 7px }
    input[type=url],textarea { display:block; width:100%; font:inherit; color:#eee; background:#11131a; border:1px solid #494d5a; border-radius:9px; padding:12px; outline-offset:2px }
    input[type=file] { max-width:100%; font:inherit; font-size:13px }
    textarea { min-height:148px; resize:vertical }
    button,#download { display:inline-block; border:0; border-radius:9px; font:inherit; font-weight:700; padding:13px 19px; cursor:pointer; text-decoration:none }
    button { color:#1b120d; background:#ff9d59 }
    button:disabled { cursor:wait; opacity:.55 }
    #download { background:#b1e6b0; color:#182b18; margin-left:10px; display:none }
    #preview { display:none; max-width:100%; max-height:300px; margin:20px auto 0; border-radius:8px }
    .note,footer { color:#8e939e; font-size:13px }
    .note { margin:14px 0 0 }
    #status { margin-top:18px; white-space:pre-wrap; overflow-wrap:anywhere; min-height:22px; font-size:13px; color:#c0c5d1 }
    footer { padding-block:15px 25px; border-top:1px solid #2a2c34 }
    @media(max-width:700px){.grid{grid-template-columns:1fr}main{padding-top:24px}.panel{padding:19px}}
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/ag-psd@14.5.2/dist/bundle.js"></script>
  <script defer src="./app.js"></script>
</head>
<body>
  <header><span class="mark" aria-hidden="true">2</span><span class="brand">2SPINE</span><span class="version">PSD → Spine</span></header>
  <main>
    <h1>Анимация из PSD</h1>
    <p class="subtitle">Исходный PSD, описание движения и экспорт результата в ZIP для Spine.</p>
    <div class="grid">
      <section class="panel">
        <h2>Исходник</h2>
        <label for="url">Прямая HTTPS-ссылка на PSD</label>
        <input type="url" id="url" autocomplete="off" placeholder="https://…/file.psd">
        <label for="file">Или открыть PSD с устройства</label>
        <input type="file" id="file" accept=".psd,image/vnd.adobe.photoshop">
        <canvas id="preview" aria-label="Предпросмотр PSD"></canvas>
        <p id="info" class="note">Порядок слоёв и исходное изображение должны сохраняться.</p>
      </section>
      <section class="panel">
        <h2>Анимация</h2>
        <label for="prompt">Описание движения</label>
        <textarea id="prompt" placeholder="Опишите анимацию"></textarea>
        <p><button type="button" id="create">Создать</button><a id="download" download="2spine-animation.zip">Скачать ZIP</a></p>
        <div id="status" role="status" aria-live="polite"></div>
      </section>
    </div>
  </main>
  <footer>2Spine · Облачная генерация. Если проверка сцены не пройдена, неполный ZIP не выдаётся.</footer>
</body>
</html>
